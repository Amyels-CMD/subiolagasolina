name: Sincronización Semanal de Precios (MICM)

on:
  schedule:
    # República Dominicana: Viernes de 1:00 PM a 5:45 PM AST (17:00 a 21:45 UTC) cada 15 min
    - cron: '*/15 17-21 * * 5'
    # Respaldo sabatino a las 8:00 AM AST (12:00 UTC) si el MICM publicó tarde o la cola falló
    - cron: '0 12 * * 6'
  workflow_dispatch: # Permite ejecución manual desde GitHub con 1 clic

concurrency:
  group: weekly-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-fuel-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer commit y push automático

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar script de sincronización oficial
        run: node scripts/weekly-sync.mjs

      - name: Verificar tipos y ejecutar pruebas de integridad
        run: |
          npx tsc --noEmit
          npm test

      - name: Verificar cambios en los datos
        id: git-check
        run: |
          if git status --porcelain src/data/fuel-history.json src/data/wti-benchmark.json | grep -q "src/data/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Guardar y desplegar nueva semana en producción
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "SubioLaGasolina Bot"
          git config --global user.email "bot@subiolagasolina.com"
          git add src/data/fuel-history.json src/data/wti-benchmark.json
          git commit -m "chore(data): auto-update precios oficiales MICM y crudo WTI"
          git pull --rebase origin main
          git push
